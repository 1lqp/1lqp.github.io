kind = "web"
previewPath = "/"
title = "NovaKeys Digital Store"
description = "A multilingual digital-subscription storefront for browsing plans, selecting transfer payment methods, placing orders, and tracking delivery. This update retains the existing shop order service and improves branding, Flexy fee calculation, responsive navigation, and WhatsApp order confirmation."
version = "1.0.0"
id = "artifacts/novakeys-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20077

[services.development]
run = "pnpm --filter @workspace/novakeys-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/novakeys-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/novakeys-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20077"
BASE_PATH = "/"
